# Builds, tests and lints the app. These are the same three commands CLAUDE.md asks for before
# every commit; warnings fail the run.
#
# A push or pull request checks Linux only, the primary platform, to keep runs quick. macOS and
# Windows are checked before every release (release.yml runs this workflow first, and a failure
# stops the release), and on demand from the Actions tab ("Run workflow"), which runs all three.
name: CI

on:
  push:
    # Tags are left to release.yml, which runs this workflow itself on every OS.
    branches: ['**']
    # Changes to docs alone (README, CLAUDE.md, docs/, the licence) can't break the build.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:
  workflow_call:
    inputs:
      # release.yml asks for all three OSes. A called workflow sees its caller's event, which is a
      # push to a branch when tag.yml starts the release, so the event can't say so.
      all_os:
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch cancels the run still going for the older one (a manual run is
# grouped apart, so a push doesn't cancel it).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ inputs.all_os }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      # Let every OS finish, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        # Linux alone for a branch push or pull request; every OS for a release (through
        # release.yml) or a manual run.
        os: ${{ fromJSON((inputs.all_os || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Keeps compiled dependencies between runs, so only our own code rebuilds.
      - uses: Swatinem/rust-cache@v2
      # --locked fails if Cargo.lock is out of date with Cargo.toml.
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  # Formatting is the same on every OS, so it is checked once.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
